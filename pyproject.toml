[project]
name = "kivy-garden-draggble"
version = "0.4.0.dev0"
description = "Drag & Drop Extension for Kivy"
authors = [
    { name = "Nattosai Mito", email = "flow4re2c@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
keywords = ["kivy"]
classifiers=[
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Programming Language :: Python',
    'Topic :: Software Development :: Libraries',
    'Operating System :: OS Independent',
]
dependencies = [
    "asynckivy>=0.12.0,<0.13",
]

[project.urls]
Repository = "https://github.com/kivy-garden/draggable"

[dependency-groups]
dev = [
    "kivy==2.3.1",
    "pytest>=9.2.0",
]

[tool.uv.build-backend]
module-name = "kivy_garden.draggable"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
